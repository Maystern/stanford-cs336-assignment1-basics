lr: 1e-3
weight_decay: 1e-4
betas: [0.9, 0.999]
eps: 1e-8
train_dataset_path: "./data/TinyStoriesV2-GPT4-train.txt"
test_dataset_path: "./data/TinyStoriesV2-GPT4-valid.txt"
cache_dir: "./cache/"
special_tokens: ["<|endoftext|>"]
num_epoch: 5000
batch_size: 32
lr_schedule:
  type: "cosine_annealing" 
  params:
    alpha_max: 1e-3
    alpha_min: 1e-5
    Tw: 500
    Tc: 5000
  # [optional]
  # type: "constant"
  # params:
  #   lr: 1e-3
model_saved_path: "./models/"
gradient_clipping:
  enable: true
  max_l2_norm: 1.0
