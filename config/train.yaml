lr: 1e-3
weight_decay: 1e-4
betas: [0.9, 0.999]
eps: 1e-8
dataset_path: "./data/TinyStoriesV2-GPT4-valid.txt"
dataset_vocab_merges_cache_dir: "./cache/"
special_tokens: ["<|endoftext|>"]
num_epoch: 1000
batch_size: 16
lr_schedule:
  type: "cosine_annealing" 
  params:
    alpha_max: 1e-3
    alpha_min: 1e-5
    Tw: 100
    Tc: 900
  # [optional]
  # type: "constant"
  # params:
  #   lr: 1e-3
model_saved_path: "./models/"